<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>advise demo</title>
<style>
  body { background: #15171a; color: #e4e6ea; font: 15px/1.5 system-ui, sans-serif; margin: 0; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .note { color: #9aa0a8; font-size: 13px; margin: 0 0 20px; }
  .seats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .seats button { background: #23262b; color: #e4e6ea; border: 1px solid #3a3f46; border-radius: 6px; padding: 8px 12px; cursor: pointer; font: inherit; }
  .seats button[aria-pressed="true"] { border-color: #6ea8fe; background: #1d2b40; }
  .seats small { color: #9aa0a8; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  textarea { width: 100%; box-sizing: border-box; min-height: 96px; background: #1d1f23; color: #e4e6ea; border: 1px solid #3a3f46; border-radius: 6px; padding: 8px; font: inherit; }
  #submit { margin-top: 14px; background: #6ea8fe; color: #0b1220; border: 0; border-radius: 6px; padding: 9px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  #submit:disabled { opacity: .5; cursor: default; }
  #verdict { margin-top: 20px; font-size: 17px; font-weight: 700; }
  #verdict.err { color: #ff8a80; }
  pre { background: #1d1f23; border: 1px solid #3a3f46; border-radius: 6px; padding: 12px; overflow-x: auto; font-size: 12.5px; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<main>
  <h1>advise() — try it</h1>
  <p class="note">Demo only. Calls are logged with consumer=demo. The key never leaves the server.</p>

  <div class="seats" role="group" aria-label="Seat">
    <button type="button" data-alias="allspaw" aria-pressed="true">allspaw <small>why did it ship?</small></button>
    <button type="button" data-alias="qe-ic-advisor" aria-pressed="false">qe-ic-advisor <small>is the fix validated?</small></button>
  </div>

  <label for="question">Question</label>
  <textarea id="question"></textarea>
  <label for="evidence">Evidence</label>
  <textarea id="evidence" placeholder="Paste the incident story, bug report or diff the seat should judge."></textarea>
  <button id="submit" type="button">Ask</button>

  <div id="verdict"></div>
  <pre id="out" hidden></pre>
</main>
<script>
const QUESTIONS = {
  "allspaw": "Is this second story about conditions, never people? Name any sentence that blames a person, and any juncture the evidence does not support.",
  "qe-ic-advisor": "Is this guard a condition (it runs by itself in CI) or an instruction (someone must remember it)? Which triggers of the bug's class does it miss?"
};
let alias = "allspaw";
const q = document.getElementById("question");
q.value = QUESTIONS[alias];

document.querySelectorAll(".seats button").forEach(b => b.addEventListener("click", () => {
  // Swap the prefill only if the user has not edited it.
  if (q.value === QUESTIONS[alias]) q.value = QUESTIONS[b.dataset.alias];
  alias = b.dataset.alias;
  document.querySelectorAll(".seats button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
}));

document.getElementById("submit").addEventListener("click", async () => {
  const btn = document.getElementById("submit"), v = document.getElementById("verdict"), out = document.getElementById("out");
  btn.disabled = true; v.className = ""; v.textContent = "…"; out.hidden = true;
  try {
    const r = await fetch("/demo/advise", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({seat_alias: alias, question: q.value, evidence: document.getElementById("evidence").value})
    });
    const body = await r.json();
    if (r.ok) { v.textContent = "verdict: " + body.verdict + "  (" + body.seat + ")"; }
    else { v.className = "err"; v.textContent = "error: " + (body.error || r.status); }
    out.textContent = JSON.stringify(body, null, 2); out.hidden = false;
  } catch (e) {
    v.className = "err"; v.textContent = "request failed: " + e;
  } finally { btn.disabled = false; }
});
</script>
</body>
</html>
